<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="publish-kit: ship once, every channel aligned">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="318" width="1200" height="2" fill="url(#accent)"/>
  <g transform="translate(80,140)" filter="url(#glow)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="800" fill="#F8FAFC">publish</text>
    <text x="280" y="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="800" fill="url(#accent)">-kit</text>
  </g>
  <text x="80" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">Ship once. Every channel aligned.</text>
  <text x="80" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748B">npm · cargo · PyPI · DSH plugins · standalone exe · skill bundles</text>
  <g transform="translate(940,40)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748B">
    <rect x="0" y="0" width="180" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="14" y="21" fill="#94A3B8">$ npx skills add ...</text>
  </g>
  <g transform="translate(940,90)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#10B981">
    <text x="0" y="12">✓ npm registry</text>
    <text x="0" y="32">✓ cargo crates.io</text>
    <text x="0" y="52">✓ PyPI</text>
    <text x="0" y="72">✓ GitHub + Gitee dual remote</text>
    <text x="0" y="92">✓ DSH 4 marketplaces</text>
    <text x="0" y="112">✓ git tag (every version)</text>
  </g>
  <text x="80" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#475569">v0.1.3 · MIT · works on DSH / Claude Code / Codex / Gemini / Cursor</text>
</svg>
